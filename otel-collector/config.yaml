# OpenTelemetry Collector (contrib) - the single front door for every signal.
#
#   METRICS  public APIs --(json-exporter)--> prometheus receiver ---+
#            public APIs <-- http_check (synthetic probes + JSON contracts) --+--> Prometheus (native OTLP)
#   TRACES   Grafana, Prometheus, Alertmanager --OTLP--> spanmetrics + servicegraph (100 %, before sampling)
#                                                   \--> tail sampling --> Tempo
#   LOGS     /var/lib/docker/containers/*.log --filelog--> Loki (native OTLP)
#
# Note on "$": the collector expands ${env:VAR}; a literal "$" (regex groups in
# relabel rules) has to be written as "$$".

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Live pipeline debugging: http://127.0.0.1:55679/debug/pipelinez
  zpages:
    endpoint: 0.0.0.0:55679

receivers:

  # ---------------------------------------------------------------- OTLP ----
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # ------------------------------------------------- forest data (pull) ----
  # A full Prometheus scrape engine inside the collector. json-exporter does the
  # JSON -> metrics part; URLs are built from the species catalog by relabeling.
  prometheus/forest:
    config:
      global:
        scrape_timeout: 30s
      scrape_configs:

        # iNaturalist: one target per species, every 4 min (< 5 min lookback,
        # so instant queries never fall into a gap).
        - job_name: inaturalist
          scrape_interval: 4m
          metrics_path: /probe
          params:
            module: [inat_observations]
          file_sd_configs:
            - files: [/etc/otelcol/species.yml]
              refresh_interval: 1m
          relabel_configs:
            - source_labels: [taxon_id]
              regex: (.+)
              target_label: __param_target
              replacement: https://api.inaturalist.org/v1/observations?taxon_id=$$1&place_id=7800&per_page=1&order_by=id&order=desc
            - source_labels: [__address__]
              target_label: instance
            - target_label: __address__
              replacement: json-exporter:7979
            - target_label: provider
              replacement: inaturalist
            - target_label: scope
              replacement: species
            - action: labeldrop
              regex: (wiki_article|gbif_key)

        # iNaturalist aggregates: all fungi in Poland, the research-grade subset
        # (community verified) and the newest fungus worldwide (freshness probe).
        - job_name: inaturalist-aggregates
          scrape_interval: 4m
          metrics_path: /probe
          params:
            module: [inat_observations]
          static_configs:
            - targets: ['https://api.inaturalist.org/v1/observations?taxon_id=47170&place_id=7800&per_page=1&order_by=id&order=desc']
              labels: {scope: fungi-pl, instance: fungi-pl}
            - targets: ['https://api.inaturalist.org/v1/observations?taxon_id=47170&place_id=7800&quality_grade=research&per_page=1&order_by=id&order=desc']
              labels: {scope: fungi-pl-research, instance: fungi-pl-research}
            - targets: ['https://api.inaturalist.org/v1/observations?taxon_id=47170&per_page=1&order_by=id&order=desc']
              labels: {scope: fungi-world, instance: fungi-world}
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - target_label: __address__
              replacement: json-exporter:7979
            - target_label: provider
              replacement: inaturalist

        # Wikipedia page views: daily data, so a slow poll is plenty. Panels and
        # rules bridge the gaps with last_over_time() (see forest.yml).
        - job_name: wikimedia
          scrape_interval: 10m
          metrics_path: /probe
          params:
            module: [wiki_pageviews]
          file_sd_configs:
            - files: [/etc/otelcol/species.yml]
              refresh_interval: 1m
          static_configs:
            # Topic articles that are not species. Use the redirect *target*:
            # "Zatrucie grzybami" redirects to "Grzyby trujące", and a redirect
            # page itself collects ~0 views (found the hard way, see README).
            - targets: [grzybobranie]
              labels: {wiki_article: Grzybobranie, species: '-', name_pl: grzybobranie, name_en: mushroom picking, edibility: topic}
            - targets: [grzyby-trujace]
              labels: {wiki_article: Grzyby_truj%C4%85ce, species: '-', name_pl: grzyby trujące, name_en: poisonous mushrooms, edibility: topic}
            - targets: [grzyby-jadalne]
              labels: {wiki_article: Grzyby_jadalne, species: '-', name_pl: grzyby jadalne, name_en: edible mushrooms, edibility: topic}
          relabel_configs:
            - source_labels: [wiki_article]
              regex: (.+)
              target_label: __param_target
              replacement: https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/pl.wikipedia.org/all-access/user/$$1/daily/20260101/20301231
            - source_labels: [__address__]
              target_label: instance
            - target_label: __address__
              replacement: json-exporter:7979
            - target_label: provider
              replacement: wikimedia
            - action: labeldrop
              regex: (taxon_id|gbif_key)

        # Mastodon hashtag trends (mastodon.social), the "social buzz" signal.
        - job_name: mastodon
          scrape_interval: 10m
          metrics_path: /probe
          params:
            module: [mastodon_tag]
          static_configs:
            - targets: [fungi, mushrooms, mushroom, mycology, FungiFriday, foraging, grzyby]
          relabel_configs:
            - source_labels: [__address__]
              target_label: tag
            - source_labels: [__address__]
              target_label: __param_target
              replacement: https://mastodon.social/api/v1/tags/$$1
            - source_labels: [__address__]
              target_label: instance
            - target_label: __address__
              replacement: json-exporter:7979
            - target_label: provider
              replacement: mastodon

        # GBIF: the global biodiversity index (iNaturalist research-grade data
        # lands here weekly, so it is a slow, independent second opinion).
        - job_name: gbif
          scrape_interval: 10m
          metrics_path: /probe
          params:
            module: [gbif_occurrences]
          file_sd_configs:
            - files: [/etc/otelcol/species.yml]
              refresh_interval: 1m
          static_configs:
            - targets: [fungi-pl]
              labels: {gbif_key: "5", scope: fungi-pl}
          relabel_configs:
            - source_labels: [gbif_key]
              regex: (.+)
              target_label: __param_target
              replacement: https://api.gbif.org/v1/occurrence/search?country=PL&taxonKey=$$1&limit=0
            - source_labels: [__address__]
              target_label: instance
            - target_label: __address__
              replacement: json-exporter:7979
            - target_label: provider
              replacement: gbif
            - source_labels: [scope]
              regex: ^$
              target_label: scope
              replacement: species
            - action: labeldrop
              regex: (taxon_id|wiki_article)

  # ---------------------------------------- synthetic probes + contracts ----
  # Independent of json-exporter: measures latency per HTTP phase and checks
  # that the payload still *means* what we think (gjson paths). A provider can
  # return 200 OK with the wrong data - that is a contract failure, not uptime.
  http_check:
    collection_interval: 2m
    initial_delay: 5s
    metrics:
      httpcheck.dns.lookup.duration: {enabled: true}
      httpcheck.client.connection.duration: {enabled: true}
      httpcheck.tls.handshake.duration: {enabled: true}
      httpcheck.response.duration: {enabled: true}
      httpcheck.tls.cert_remaining: {enabled: true}
      httpcheck.validation.passed: {enabled: true}
      httpcheck.validation.failed: {enabled: true}
      httpcheck.response.size: {enabled: true}
    targets:
      - endpoint: https://api.inaturalist.org/v1/observations?taxon_id=47170&place_id=7800&per_page=1&order_by=id&order=desc
        headers:
          User-Agent: mycelium-observability/1.0 (+https://github.com/jeti20/mycelium; synthetic probe)
        validations:
          # the newest observation in a fungi query must actually be a fungus
          - json_path: results.0.taxon.iconic_taxon_name
            equals: Fungi
          - json_path: results.0.place_ids.#(==7800)
            equals: "7800"
      - endpoint: https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/pl.wikipedia.org/all-access/user/Grzybobranie/daily/20260101/20301231
        headers:
          User-Agent: mycelium-observability/1.0 (+https://github.com/jeti20/mycelium; synthetic probe)
        validations:
          - json_path: items.0.project
            equals: pl.wikipedia
          - json_path: items.0.agent
            equals: user
      - endpoint: https://mastodon.social/api/v1/tags/fungi
        headers:
          User-Agent: mycelium-observability/1.0 (+https://github.com/jeti20/mycelium; synthetic probe)
        validations:
          - json_path: name
            equals: fungi
          - json_path: history.#
            equals: "7"
      - endpoint: https://api.gbif.org/v1/occurrence/search?country=PL&taxonKey=5&limit=0
        headers:
          User-Agent: mycelium-observability/1.0 (+https://github.com/jeti20/mycelium; synthetic probe)
        validations:
          - json_path: limit
            equals: "0"
          - contains: '"count":'

  # ------------------------------------------------------------- logs ----
  # Docker's json-file driver writes the compose service/project names into
  # every line ("attrs"), configured in docker-compose.yml. No Docker API needed.
  file_log/docker:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    include_file_path: false
    operators:
      # {"log":"...","stream":"stderr","attrs":{...},"time":"..."}
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch: {}

  # 1. Tag each probe with the public API it belongs to (the SLO "service").
  # 2. httpcheck.status emits one series per status code, so after a failure the
  #    old "200" series would linger for 5 min (OTLP has no staleness markers)
  #    and mask the outage. httpcheck.success is a copy with exactly ONE series
  #    per provider and ONE data point per probe: 1 = got a 2xx, 0 = anything
  #    else (timeout, DNS, 5xx, 429...). Event-based SLIs count these points.
  transform/probes:
    error_mode: ignore
    metric_statements:
      - statements:
          - copy_metric(name="httpcheck.success", description="1 if the probe received a 2xx response, 0 otherwise. One data point per probe.") where metric.name == "httpcheck.status"
      - statements:
          - delete_key(datapoint.attributes, "http.status_code") where metric.name == "httpcheck.success"
          - delete_key(datapoint.attributes, "http.method") where metric.name == "httpcheck.success"
          - set(datapoint.attributes["provider"], "inaturalist") where IsMatch(datapoint.attributes["http.url"], "inaturalist\\.org")
          - set(datapoint.attributes["provider"], "wikimedia") where IsMatch(datapoint.attributes["http.url"], "wikimedia\\.org")
          - set(datapoint.attributes["provider"], "mastodon") where IsMatch(datapoint.attributes["http.url"], "mastodon\\.social")
          - set(datapoint.attributes["provider"], "gbif") where IsMatch(datapoint.attributes["http.url"], "gbif\\.org")

  filter/probes:
    error_mode: ignore
    metrics:
      datapoint:
        - metric.name == "httpcheck.success" and datapoint.attributes["http.status_class"] != "2xx"

  resource/probes:
    attributes:
      - key: service.name
        value: synthetic-probes
        action: upsert

  # Logs: keep only this project's containers and name them after the compose service.
  filter/own-containers:
    error_mode: ignore
    logs:
      log_record:
        - log.attributes["attrs"]["com.docker.compose.project"] != "mycelium"

  transform/logs:
    error_mode: ignore
    log_statements:
      - statements:
          - set(resource.attributes["service.name"], log.attributes["attrs"]["com.docker.compose.service"])
          - set(resource.attributes["service.namespace"], "mycelium")
          - delete_key(log.attributes, "attrs")
          - replace_pattern(log.body, "\n$$", "")
          # Grafana, Loki, Tempo... log in logfmt; surface the level for Loki.
          - set(log.severity_text, ToUpperCase(ExtractPatterns(log.body, "level=(?P<lvl>[a-zA-Z]+)")["lvl"])) where IsMatch(log.body, "level=[a-zA-Z]+")
          - set(log.attributes["trace_id"], ExtractPatterns(log.body, "traceID=(?P<tid>[0-9a-f]{16,32})")["tid"]) where IsMatch(log.body, "traceID=[0-9a-f]{16,32}")

  # Grafana runs each datasource plugin as a child process that reports spans
  # under the plugin id - the Prometheus plugin calls itself "prometheus",
  # exactly like the real Prometheus server. Rename plugin processes to
  # "grafana-plugin:<id>" so the service graph shows grafana -> plugin -> prometheus.
  transform/plugins:
    error_mode: ignore
    trace_statements:
      - statements:
          - set(resource.attributes["service.name"], Format("grafana-plugin:%s", [resource.attributes["service.name"]])) where IsMatch(span.name, "^(pluginv2[.]|sdk[.]|datasource[.])") and resource.attributes["service.name"] != "grafana" and not IsMatch(resource.attributes["service.name"], "^grafana-plugin:")

  # Plugin process plumbing (start/stop/stdio streams of every installed plugin):
  # no user value, and it fills the service graph with idle plugins.
  filter/plugin-noise:
    error_mode: ignore
    traces:
      span:
        - IsMatch(span.name, "^plugin[.]GRPC")

  # Keep every error, every slow trace and the whole alert-delivery path;
  # keep a quarter of ordinary user requests; drop background noise (Grafana's
  # internal jobs, /metrics scrapes). RED metrics are computed *before* this
  # step from 100 % of spans, so sampling never skews the platform SLOs.
  tail_sampling:
    decision_wait: 10s
    num_traces: 20000
    policies:
      - name: errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: slow
        type: latency
        latency: {threshold_ms: 500}
      - name: alert-delivery
        type: string_attribute
        string_attribute: {key: service.name, values: [alertmanager]}
      - name: user-requests
        type: and
        and:
          and_sub_policy:
            - name: server-span
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - span.kind.string == "Server" and not IsMatch(span.name, "/metrics$")
            - name: one-in-four
              type: probabilistic
              probabilistic: {sampling_percentage: 25}

connectors:
  # RED metrics from 100 % of spans (calls, errors, duration as a native histogram + exemplars).
  span_metrics:
    histogram:
      unit: s
      exponential:
        max_size: 160
    exemplars:
      enabled: true
    metrics_flush_interval: 15s
    dimensions:
      - name: http.response.status_code
  # Service topology (who calls whom), drawn by Grafana's service graph.
  service_graph:
    latency_histogram_buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
    store:
      ttl: 5s
      max_items: 5000
    metrics_flush_interval: 15s
  forward/sampling: {}

exporters:
  # Prometheus 3 speaks OTLP natively (--web.enable-otlp-receiver): no remote_write, no exporter sidecar.
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  extensions: [health_check, zpages]
  telemetry:
    logs:
      level: info
    # The collector's own health is *pulled* by Prometheus on :8888, outside
    # the pipeline it describes (meta-monitoring must not depend on itself).
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_scope_info: true
                without_type_suffix: false
  pipelines:
    metrics/forest:
      receivers: [prometheus/forest]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
    metrics/probes:
      receivers: [http_check]
      processors: [memory_limiter, transform/probes, filter/probes, resource/probes, batch]
      exporters: [otlp_http/prometheus]
    metrics/traces:
      receivers: [span_metrics, service_graph]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
    traces/ingest:
      receivers: [otlp]
      processors: [memory_limiter, transform/plugins, filter/plugin-noise]
      exporters: [span_metrics, service_graph, forward/sampling]
    traces/sampled:
      receivers: [forward/sampling]
      processors: [tail_sampling, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [file_log/docker]
      processors: [memory_limiter, filter/own-containers, transform/logs, batch]
      exporters: [otlp_http/loki]
