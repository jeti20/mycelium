apiVersion: 1

# Three pillars, wired together:
#   metrics --exemplar trace_id--> traces --service.name + time--> logs
#   logs    --trace_id (structured metadata / traceID=)--> traces
#   traces  --span metrics--> metrics,  service graph from the collector

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      prometheusType: Prometheus
      prometheusVersion: 3.15.0
      httpMethod: POST
      timeInterval: 30s
      incrementalQuerying: false
      # Shows the Prometheus alert rules (read-only) in Grafana -> Alerting.
      manageAlerts: true
      # Dots on latency graphs -> click -> the exact trace in Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: Open trace in Tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      streamingEnabled:
        search: true
        metrics: true
      nodeGraph:
        enabled: true
      # Service graph built by the collector's servicegraph connector.
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}" or traceID="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
        queries:
          - name: Request rate
            query: sum by (span_name) (rate(traces_span_metrics_calls_total{$$__tags}[5m]))
          - name: p95 latency
            query: histogram_quantile(0.95, sum by (span_name) (rate(traces_span_metrics_duration_seconds{$$__tags}[5m])))
      lokiSearch:
        datasourceUid: loki

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        # trace id extracted by the collector into structured metadata
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
        # ...and Grafana's own logfmt lines
        - name: traceID
          matcherType: regex
          matcherRegex: 'traceID=(\w+)'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  # Infinity reads public JSON at query time - for things that don't belong in
  # a TSDB: the latest observations with photos and coordinates, top species.
  - name: Infinity
    uid: infinity
    type: yesoreyeram-infinity-datasource
    jsonData:
      allowedHosts:
        - https://api.inaturalist.org
        - https://mastodon.social
