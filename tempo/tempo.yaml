# Grafana Tempo 3 - monolithic mode (-target=all, no Kafka), local storage.
# Traces arrive already tail-sampled from the OpenTelemetry Collector. RED
# metrics and the service graph are computed in the collector from 100 % of
# spans, so Tempo only stores, searches and answers TraceQL.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Compaction and retention run in the in-process backend worker.
backend_worker:
  compaction:
    block_retention: 72h

usage_report:
  reporting_enabled: false
