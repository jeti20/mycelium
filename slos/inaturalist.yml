# SLOs for iNaturalist - the primary data source (citizen-science observations).
#
# Source of truth for prometheus/rules/slo/inaturalist.yml, generated by Sloth:
#   docker compose run --rm sloth-generate
# CI regenerates the rules and fails if the committed output differs.
#
# Why these SLIs and objectives: docs/slo-decisions.md

version: prometheus/v1
service: inaturalist
labels:
  provider: inaturalist
  tier: upstream
  owner: mycelium
slos:

  # Event-based: every synthetic probe is one event (720/day). Synthetic traffic
  # instead of the real consumer's scrapes because scrapes are too sparse for
  # meaningful burn rates on short windows (SRE Workbook, "low-traffic services").
  - name: availability
    objective: 99.5
    description: Probes of the observations API that receive a 2xx response.
    sli:
      events:
        error_query: |
          sum(count_over_time(httpcheck_success{provider="inaturalist"}[{{.window}}]))
          -
          sum(sum_over_time(httpcheck_success{provider="inaturalist"}[{{.window}}]))
        total_query: |
          sum(count_over_time(httpcheck_success{provider="inaturalist"}[{{.window}}]))
    alerting:
      name: InaturalistAvailabilityBudgetBurn
      labels:
        category: slo
      annotations:
        summary: iNaturalist availability SLO is burning its error budget
        description: Synthetic probes of api.inaturalist.org are failing faster than the 99.5 % objective allows.
        runbook_url: https://github.com/jeti20/mycelium/blob/main/docs/runbooks.md#provider-budget-burn
        dashboard_url: http://127.0.0.1:3030/d/myc-slo?var-service=inaturalist
      # Someone else's outage: we can't fix it, so it never pages - fast burn
      # opens a ticket, slow burn is recorded for the dashboard only.
      page_alert:
        labels:
          severity: ticket
      ticket_alert:
        labels:
          severity: none

  # Probe answered 2xx within the threshold. Threshold is a recording rule
  # (provider:latency_threshold:ms in sli.yml), tuned from real p95 data.
  - name: latency
    objective: 99
    description: Probes that receive a 2xx response within the latency threshold.
    sli:
      raw:
        error_ratio_query: |
          1 - avg(avg_over_time(provider:probe_latency_good:bool{provider="inaturalist"}[{{.window}}]))
    alerting:
      name: InaturalistLatencyBudgetBurn
      labels:
        category: slo
      annotations:
        summary: iNaturalist latency SLO is burning its error budget
        description: Too many probes of api.inaturalist.org are slow or failing.
        runbook_url: https://github.com/jeti20/mycelium/blob/main/docs/runbooks.md#provider-budget-burn
        dashboard_url: http://127.0.0.1:3030/d/myc-slo?var-service=inaturalist
      page_alert:
        labels:
          severity: ticket
      ticket_alert:
        labels:
          severity: none

  # Time-based: the fraction of time the newest fungus observation worldwide
  # changed within the last 20 minutes (ids only grow).
  - name: freshness
    objective: 99
    description: Time during which new fungi observations keep arriving (newest id changed within 20 min).
    sli:
      raw:
        error_ratio_query: |
          1 - avg(avg_over_time(provider:freshness_good:bool{provider="inaturalist"}[{{.window}}]))
    alerting:
      name: InaturalistFreshnessBudgetBurn
      labels:
        category: slo
      annotations:
        summary: iNaturalist data is going stale
        description: No new fungi observations have been seen for long stretches - the API may be serving a cached or frozen index.
        runbook_url: https://github.com/jeti20/mycelium/blob/main/docs/runbooks.md#provider-budget-burn
        dashboard_url: http://127.0.0.1:3030/d/myc-slo?var-service=inaturalist
      page_alert:
        labels:
          severity: ticket
      ticket_alert:
        labels:
          severity: none

  # Event-based: every JSON contract check is one event. 200 OK with the wrong
  # payload is an error the availability SLI can't see.
  - name: correctness
    objective: 99.9
    description: Response contract checks (gjson validations) that pass.
    sli:
      events:
        error_query: |
          sum(sum_over_time(httpcheck_validation_failed{provider="inaturalist"}[{{.window}}])) or vector(0)
        total_query: |
          (sum(sum_over_time(httpcheck_validation_failed{provider="inaturalist"}[{{.window}}])) or vector(0))
          +
          sum(sum_over_time(httpcheck_validation_passed{provider="inaturalist"}[{{.window}}]))
    alerting:
      name: InaturalistCorrectnessBudgetBurn
      labels:
        category: slo
      annotations:
        summary: iNaturalist responses violate the data contract
        description: The API answers, but the payload no longer matches what Mycelium expects (schema or semantics changed).
        runbook_url: https://github.com/jeti20/mycelium/blob/main/docs/runbooks.md#contract-broken
        dashboard_url: http://127.0.0.1:3030/d/myc-slo?var-service=inaturalist
      page_alert:
        labels:
          severity: ticket
      ticket_alert:
        labels:
          severity: none
