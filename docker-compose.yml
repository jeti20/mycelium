# Mycelium - SLO-driven observability for Poland's mushroom season.
#
#  iNaturalist · Wikimedia · Mastodon · GBIF
#        |  HTTPS/JSON                       Grafana · Prometheus · Alertmanager
#        v                                          | OTLP traces
#  json-exporter <--scrape-- OpenTelemetry Collector <------+
#                            (http_check probes, filelog)    container logs
#                               |  OTLP        |  OTLP       |  OTLP
#                               v              v             v
#                           Prometheus 3     Tempo 3       Loki 3
#                               |  (Sloth-generated SLO rules)
#                           Alertmanager --SMTP--> Mailpit (web inbox)
#                               |
#                           Grafana 13 (+ Infinity: live iNaturalist photos & map)

name: mycelium

# Every published port binds to 127.0.0.1 (BIND_ADDR in .env). Grafana allows
# anonymous editing and nothing else has authentication - see SECURITY.md.

# Docker's json-file driver copies these container labels into every log
# line ("attrs"); the collector uses them to name the service. No Docker API.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: com.docker.compose.project,com.docker.compose.service

services:

  json-exporter:
    image: prometheuscommunity/json-exporter:v0.8.0
    command: ["--config.file=/etc/json-exporter/config.yml"]
    volumes:
      - ./json-exporter/config.yml:/etc/json-exporter/config.yml:ro
    restart: unless-stopped
    logging: *logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    # filelog needs to read Docker's log files (owned by root).
    user: "0:0"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:55679:55679"   # zPages: /debug/pipelinez
    volumes:
      - ./otel-collector:/etc/otelcol:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [json-exporter, prometheus, tempo, loki]
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d
      - --web.enable-otlp-receiver
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9091:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://127.0.0.1:9094
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9094:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    depends_on: [mailpit]
    restart: unless-stopped
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_ENABLE_PROMETHEUS: "true"
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      TZ: Europe/Warsaw
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8025:8025"     # web inbox
    volumes:
      - mailpit_data:/data
    restart: unless-stopped
    logging: *logging

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    user: "0:0"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    logging: *logging

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    logging: *logging

  # Sloth's web UI: SLO list, budgets and burn rates read from Prometheus.
  sloth:
    image: ghcr.io/slok/sloth:v0.16.0
    command:
      - server
      - --prometheus-address=http://prometheus:9090
      - --app-listen-address=:8080
      - --status-listen-address=:8081
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:8080"
    # Sloth warms its cache from Prometheus at start and exits if it isn't ready.
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GF_ANONYMOUS_ROLE:-Editor}
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/Forest/home.json
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource
      GF_SERVER_ROOT_URL: http://127.0.0.1:3030
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana traces itself (and propagates W3C context to Prometheus/Tempo/Loki).
      GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS: otel-collector:4317
      GF_TRACING_OPENTELEMETRY_OTLP_PROPAGATION: w3c
      GF_TRACING_OPENTELEMETRY_SAMPLER_TYPE: const
      GF_TRACING_OPENTELEMETRY_SAMPLER_PARAM: "1"
      GF_TRACING_OPENTELEMETRY_CUSTOM_ATTRIBUTES: service.namespace:mycelium
      # Server-side rendering (PNG export, README screenshots).
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GF_RENDERER_TOKEN:-change-me-renderer-token}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3030:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo, alertmanager, renderer]
    restart: unless-stopped
    logging: *logging

  renderer:
    image: grafana/grafana-image-renderer:v5.12.10
    environment:
      AUTH_TOKEN: ${GF_RENDERER_TOKEN:-change-me-renderer-token}
    restart: unless-stopped
    logging: *logging

  # --------------------------------------------------------------------------
  # Tooling - profile "tools", never started by `docker compose up`.
  #   docker compose run --rm sloth-generate   # slos/*.yml -> prometheus/rules/slo/*.yml
  #   docker compose run --rm promtool test rules tests/*.yml
  # --------------------------------------------------------------------------
  sloth-generate:
    image: ghcr.io/slok/sloth:v0.16.0
    profiles: [tools]
    command: ["generate", "--input=/slos", "--out=/out", "--default-slo-period=30d"]
    # The image runs as nonroot; on Linux it must write as the repo owner or the bind mount is read-only for it.
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    volumes:
      - ./slos:/slos:ro
      - ./prometheus/rules/slo:/out

  sloth-validate:
    image: ghcr.io/slok/sloth:v0.16.0
    profiles: [tools]
    command: ["validate", "--input=/slos"]
    volumes:
      - ./slos:/slos:ro

  promtool:
    image: prom/prometheus:v3.15.1
    profiles: [tools]
    entrypoint: ["promtool"]
    working_dir: /etc/prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro

  amtool:
    image: prom/alertmanager:v0.34.2
    profiles: [tools]
    entrypoint: ["amtool"]
    command: ["check-config", "/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  amtool-routes:
    image: prom/alertmanager:v0.34.2
    profiles: [tools]
    entrypoint: ["sh", "-c"]
    command:
      - |
        fail=0
        while read -r receiver labels; do
          case "$$receiver" in ''|'#'*) continue ;; esac
          if amtool config routes test --config.file=/etc/alertmanager/alertmanager.yml --verify.receivers="$$receiver" $$labels >/dev/null; then
            echo "ok    $$receiver  <- $$labels"
          else
            echo "FAIL  expected $$receiver  <- $$labels"; fail=1
          fi
        done < /etc/alertmanager/routing-tests.txt
        exit $$fail
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  pint:
    image: ghcr.io/cloudflare/pint:0.89.2
    profiles: [tools]
    command: ["pint", "--config=/work/.pint.hcl", "--no-color", "lint", "/work/prometheus/rules"]
    volumes:
      - ./:/work:ro

  otelcol-validate:
    image: otel/opentelemetry-collector-contrib:0.164.0
    profiles: [tools]
    command: ["validate", "--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector:/etc/otelcol:ro

  loki-validate:
    image: grafana/loki:3.7.9
    profiles: [tools]
    command: ["-config.file=/etc/loki/loki.yaml", "-verify-config"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro

volumes:
  prometheus_data:
  alertmanager_data:
  mailpit_data:
  tempo_data:
  loki_data:
  grafana_data:
