# Prometheus 3 - two planes, two transports:
#
#   DATA plane      forest metrics, synthetic probes, span metrics
#                   -> PUSHED by the OpenTelemetry Collector over native OTLP
#                      (/api/v1/otlp, enabled with --web.enable-otlp-receiver)
#   PLATFORM plane  every component's own /metrics
#                   -> PULLED here directly, so the TSDB still knows when the
#                      collector itself is broken.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    stack: mycelium

# --- OTLP ingestion ---------------------------------------------------------
otlp:
  # job/instance come from service.name/service.instance.id automatically;
  # everything else stays on target_info unless promoted here.
  promote_resource_attributes:
    - service.namespace
    - deployment.environment.name
  translation_strategy: UnderscoreEscapingWithSuffixes

storage:
  tsdb:
    # OTLP batches can arrive slightly out of order - accept up to 30 min late.
    out_of_order_time_window: 30m
  exemplars:
    max_exemplars: 100000

# --- Prometheus traces its own query path into the collector ---------------
# Grafana propagates W3C trace context, so a dashboard refresh becomes one
# trace: grafana -> prometheus (query, PromQL eval) -> TSDB.
tracing:
  client_type: grpc
  endpoint: otel-collector:4317
  insecure: true
  # Parent-based sampler: requests arriving with a sampled parent (every Grafana
  # query) are always traced. Only Prometheus' own root spans - mostly the
  # evaluation of ~360 rules every 30 s, ~300 spans/s at 1.0 - are sampled.
  sampling_fraction: 0.02

rule_files:
  - rules/*.yml
  - rules/slo/*.yml   # generated by Sloth from slos/*.yml - do not edit by hand

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: json-exporter
    static_configs:
      - targets: [json-exporter:7979]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: mailpit
    static_configs:
      - targets: [mailpit:8025]

  - job_name: sloth
    static_configs:
      - targets: [sloth:8081]
